<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PingPong Teleco Huelva</title>
<meta name="theme-color" content="#0E3A30" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
<link rel="stylesheet" href="./styles.css" />
<style>
  body{margin:0;background:#FAF6EC;}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#c9bfa2;border-radius:3px}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}
  #root:empty::before{
    content:"Cargando…";
    display:flex;height:100vh;align-items:center;justify-content:center;
    font-family:Inter,sans-serif;color:#FF6A34;font-size:14px;
  }
  .ppth-ball{
    font-size:26px;line-height:1;display:inline-block;
    animation:ppth-bounce 2.6s ease-in-out infinite;
  }
  @keyframes ppth-bounce{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    25%{ transform: translateY(-5px) rotate(-8deg); }
    50%{ transform: translateY(0) rotate(0deg); }
    75%{ transform: translateY(-2px) rotate(6deg); }
  }
  .ppth-fade{ animation: ppth-fadein .28s ease-out; }
  @keyframes ppth-fadein{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .ppth-dots{
    position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image: radial-gradient(rgba(250,246,236,0.14) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  @media (prefers-reduced-motion: reduce){
    .ppth-ball{ animation:none; }
    .ppth-fade{ animation:none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./bundle.js"></script>
</body>
</html>
