<link rel="preconnect" href="https://fonts.googleapis.com" />

<link rel="stylesheet" href="./styles.css" />
<style>
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    margin:0;background:#FAF6EC;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  .ppth-sheet{ max-height:85vh; overscroll-behavior: contain; }
  button{ -webkit-appearance:none; appearance:none; }
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#c9bfa2;border-radius:3px}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}
  #root:empty::before{
    content:"Cargando…";
    display:flex;height:100vh;align-items:center;justify-content:center;
    font-family:Inter,sans-serif;color:#FF6A34;font-size:14px;
  }
  .ppth-ball{
    font-size:26px;line-height:1;display:inline-block;
    animation:ppth-bounce 2.6s ease-in-out infinite;
  }
  @keyframes ppth-bounce{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    25%{ transform: translateY(-5px) rotate(-8deg); }
    50%{ transform: translateY(0) rotate(0deg); }
    75%{ transform: translateY(-2px) rotate(6deg); }
  }
  .ppth-fade{ animation: ppth-fadein .28s ease-out; }
  @keyframes ppth-fadein{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .ppth-dots{
    position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image: radial-gradient(rgba(250,246,236,0.14) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .ppth-noscroll{ scrollbar-width:none; -ms-overflow-style:none; }
  .ppth-noscroll::-webkit-scrollbar{ display:none; }
  .ppth-sheet{ animation: ppth-slideup .24s ease-out; }
  @keyframes ppth-slideup{
    from{ transform: translateY(100%); }
    to{ transform: translateY(0); }
  }
  /* iOS Safari: la barra de direcciones cambia de alto, así que usamos
     unidades de viewport dinámicas donde el navegador las soporte. */
  @supports (height: 100dvh){
    .min-h-screen{ min-height:100dvh; }
    #root:empty::before{ height:100dvh; }
    .ppth-sheet{ max-height:85dvh; }
  }
  @media (prefers-reduced-motion: reduce){
    .ppth-ball{ animation:none; }
    .ppth-fade{ animation:none; }
    .ppth-sheet{ animation:none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="./bundle.js"></script>
</body>
</html>
