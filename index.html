<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------------------------------------------------------------
   PingPong Teleco Huelva — liga interna de ping pong
--------------------------------------------------------------- */

const C = {
  boardDark: "#0E3A30",
  boardDarker: "#092D25",
  cream: "#FAF6EC",
  paper: "#FFFFFF",
  ink: "#15261F",
  inkSoft: "#4B6157",
  ball: "#FF6A34",
  ballDark: "#E0551F",
  gold: "#E3B23C",
  line: "#E1D9C4",
  win: "#2E8B5B",
  loss: "#C24A32",
};

const ICON = {
  menu: "☰", close: "✕", users: "👥", swords: "🏓", list: "📋",
  trophy: "🏆", chart: "📊", sparkles: "✨", plus: "＋", trash: "🗑️",
  refresh: "↻", check: "✓", edit: "✎", award: "🏅", chevron: "›",
  flame: "🔥", trending: "📈", target: "🎯", loader: "⏳",
};
function Ico({ k, size = 18, style }) {
  return <span aria-hidden="true" style={{ fontSize: size, lineHeight: 1, ...style }}>{ICON[k]}</span>;
}

const DEFAULT_PLAYERS = ["Paloma", "Patricia", "Miguel", "Escudero", "Pablo", "David", "Rocío"];

function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

function emptyData() {
  return {
    players: DEFAULT_PLAYERS.map((name) => ({ id: uid("p"), name })),
    matches: [],
    playoffs: null,
  };
}

/* ---------------- almacenamiento compartido (jsonblob.com) ---------------- */
/* Sin servidor propio: usamos un "blob" JSON público y gratuito para que
   todo el grupo vea y edite la misma liga desde el móvil. El id del blob
   se guarda en la URL (?liga=ID) y en localStorage de cada dispositivo. */

const BLOB_API = "https://jsonblob.com/api/jsonBlob";

function getLigaIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("liga");
}

function setLigaIdInUrl(id) {
  const url = new URL(window.location.href);
  url.searchParams.set("liga", id);
  window.history.replaceState({}, "", url.toString());
}

async function createBlob(data) {
  const res = await fetch(BLOB_API, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify(data),
  });
  const loc = res.headers.get("Location") || res.headers.get("location");
  if (!loc) throw new Error("No se pudo crear el almacenamiento compartido");
  const id = loc.split("/").pop();
  return id;
}

async function readBlob(id) {
  const res = await fetch(`${BLOB_API}/${id}`, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("Blob no encontrado");
  return res.json();
}

async function writeBlob(id, data) {
  const res = await fetch(`${BLOB_API}/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error("No se pudo guardar");
}

/* ---------------- helpers de liga ---------------- */

function generateRoundRobinRounds(ids) {
  let arr = [...ids];
  const hasBye = arr.length % 2 !== 0;
  if (hasBye) arr.push(null);
  const n = arr.length;
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const roundPairs = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i];
      const b = arr[n - 1 - i];
      if (a !== null && b !== null) {
        roundPairs.push(r % 2 === 0 ? [a, b] : [b, a]);
      }
    }
    rounds.push(roundPairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  return rounds;
}

function buildSchedule(players) {
  const ids = players.map((p) => p.id);
  const rounds = generateRoundRobinRounds(ids);
  const matches = [];
  [1, 2].forEach((leg) => {
    rounds.forEach((round, rIdx) => {
      round.forEach(([home, away]) => {
        const [h, a] = leg === 1 ? [home, away] : [away, home];
        matches.push({
          id: uid("m"), leg, round: rIdx + 1,
          homeId: h, awayId: a,
          homeScore: null, awayScore: null, played: false, playedAt: null,
        });
      });
    });
  });
  return matches;
}

function isValidScore(a, b) {
  if (a === "" || b === "" || a === null || b === null) return false;
  const x = Number(a), y = Number(b);
  if (!Number.isInteger(x) || !Number.isInteger(y)) return false;
  if (x < 0 || y < 0 || x === y) return false;
  return Math.max(x, y) >= 11 && Math.abs(x - y) >= 2;
}

function computeStandings(players, matches) {
  const table = {};
  players.forEach((p) => { table[p.id] = { id: p.id, name: p.name, pj: 0, pg: 0, pp: 0, pf: 0, pc: 0, pts: 0 }; });
  const regular = matches.filter((m) => m.played && m.leg);
  regular.forEach((m) => {
    const h = table[m.homeId], a = table[m.awayId];
    if (!h || !a) return;
    h.pj++; a.pj++;
    h.pf += m.homeScore; h.pc += m.awayScore;
    a.pf += m.awayScore; a.pc += m.homeScore;
    if (m.homeScore > m.awayScore) { h.pg++; h.pts += 2; a.pp++; } else { a.pg++; a.pts += 2; h.pp++; }
  });

  // Desempate: 1) puntos de liga, 2) enfrentamiento particular (ida+vuelta),
  // 3) ratio puntos a favor / puntos en contra, 4) puntos a favor.
  function ratio(p) {
    if (p.pc > 0) return p.pf / p.pc;
    return p.pf > 0 ? Infinity : 0;
  }
  function headToHead(x, y) {
    const meetings = regular.filter(
      (m) => (m.homeId === x.id && m.awayId === y.id) || (m.homeId === y.id && m.awayId === x.id)
    );
    if (meetings.length === 0) return 0;
    let xWins = 0, yWins = 0;
    meetings.forEach((m) => {
      const winnerId = m.homeScore > m.awayScore ? m.homeId : m.awayId;
      if (winnerId === x.id) xWins++; else if (winnerId === y.id) yWins++;
    });
    return yWins - xWins; // positivo => y por delante
  }

  return Object.values(table).sort((x, y) => {
    if (y.pts !== x.pts) return y.pts - x.pts;
    const h2h = headToHead(x, y);
    if (h2h !== 0) return h2h;
    const rx = ratio(x), ry = ratio(y);
    if (ry !== rx) return ry - rx;
    return y.pf - x.pf;
  });
}

function regularMatches(matches) { return matches.filter((m) => m.leg === 1 || m.leg === 2); }

function winnerLoser(match) {
  if (!match || !match.played) return { winnerId: null, loserId: null };
  return match.homeScore > match.awayScore
    ? { winnerId: match.homeId, loserId: match.awayId }
    : { winnerId: match.awayId, loserId: match.homeId };
}

/* ---------------- app ---------------- */

const NAV = [
  { key: "jugadores", label: "Jugadores", icon: "users" },
  { key: "partidos", label: "Partidos", icon: "swords" },
  { key: "clasificacion", label: "Clasificación", icon: "list" },
  { key: "playoffs", label: "Playoffs", icon: "trophy" },
  { key: "stats", label: "Estadísticas", icon: "chart" },
  { key: "curiosidades", label: "Curiosidades", icon: "sparkles" },
];

function App() {
  const [data, setData] = useState(null);
  const [blobId, setBlobId] = useState(null);
  const [mode, setMode] = useState("loading"); // loading | synced | local | error
  const [saving, setSaving] = useState(false);
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [view, setView] = useState("partidos");
  const [copied, setCopied] = useState(false);

  useEffect(() => { init(); }, []);

  async function init() {
    const urlId = getLigaIdFromUrl();
    const cachedId = localStorage.getItem("ppth_blob_id");
    const id = urlId || cachedId;
    try {
      if (id) {
        const remote = await readBlob(id);
        setBlobId(id);
        setLigaIdInUrl(id);
        localStorage.setItem("ppth_blob_id", id);
        localStorage.setItem("ppth_cache", JSON.stringify(remote));
        setData(remote);
        setMode("synced");
      } else {
        const initial = emptyData();
        const newId = await createBlob(initial);
        setBlobId(newId);
        setLigaIdInUrl(newId);
        localStorage.setItem("ppth_blob_id", newId);
        localStorage.setItem("ppth_cache", JSON.stringify(initial));
        setData(initial);
        setMode("synced");
      }
    } catch (e) {
      const cached = localStorage.getItem("ppth_cache");
      setData(cached ? JSON.parse(cached) : emptyData());
      setMode("local");
    }
  }

  const persist = useCallback(async (next) => {
    setData(next);
    localStorage.setItem("ppth_cache", JSON.stringify(next));
    if (mode === "local" || !blobId) return;
    setSaving(true);
    try {
      await writeBlob(blobId, next);
    } catch (e) {
      setMode("local");
    } finally {
      setSaving(false);
    }
  }, [blobId, mode]);

  async function refreshFromServer() {
    if (!blobId) return;
    setSaving(true);
    try {
      const remote = await readBlob(blobId);
      setData(remote);
      localStorage.setItem("ppth_cache", JSON.stringify(remote));
      setMode("synced");
    } catch (e) {
      setMode("local");
    } finally {
      setSaving(false);
    }
  }

  if (!data) {
    return (
      <div style={{ background: C.cream }} className="min-h-screen flex items-center justify-center">
        <Ico k="loader" size={28} style={{ color: C.ball }} />
      </div>
    );
  }

  const players = data.players, matches = data.matches, playoffs = data.playoffs;
  const standings = computeStandings(players, matches);
  const reg = regularMatches(matches);
  const regularDone = reg.length > 0 && reg.every((m) => m.played);

  function addPlayer(name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    persist({ ...data, players: [...players, { id: uid("p"), name: trimmed }] });
  }
  function renamePlayer(id, name) {
    const trimmed = name.trim();
    if (!trimmed) return;
    persist({ ...data, players: players.map((p) => (p.id === id ? { ...p, name: trimmed } : p)) });
  }
  function deletePlayer(id) {
    persist({ ...data, players: players.filter((p) => p.id !== id) });
  }
  function generateSchedule() {
    if (players.length < 3) return;
    persist({ ...data, matches: buildSchedule(players), playoffs: null });
  }
  function resetLeague() {
    persist(emptyData());
  }
  function saveMatchResult(matchId, homeScore, awayScore) {
    persist({
      ...data,
      matches: matches.map((m) => m.id === matchId
        ? { ...m, homeScore: Number(homeScore), awayScore: Number(awayScore), played: true, playedAt: Date.now() }
        : m),
    });
  }
  function generatePlayoffs() {
    const top4 = standings.slice(0, 4);
    if (top4.length < 4) return;
    const mk = (seedHome, seedAway, home, away, label) => ({
      id: uid("po"), label, seedHome, seedAway,
      homeId: home.id, awayId: away.id,
      homeScore: null, awayScore: null, played: false, playedAt: null,
    });
    const semi1 = mk(1, 4, top4[0], top4[3], "Semifinal 1");
    const semi2 = mk(2, 3, top4[1], top4[2], "Semifinal 2");
    persist({ ...data, playoffs: { seeds: top4.map((s) => ({ id: s.id, name: s.name })), semi1, semi2, final: null, third: null } });
  }
  function savePlayoffResult(key, homeScore, awayScore) {
    const updated = { ...playoffs[key], homeScore: Number(homeScore), awayScore: Number(awayScore), played: true, playedAt: Date.now() };
    persist({ ...data, playoffs: { ...playoffs, [key]: updated } });
  }
  function generateFinalStage() {
    const { semi1, semi2 } = playoffs;
    if (!semi1.played || !semi2.played) return;
    const w1 = winnerLoser(semi1), w2 = winnerLoser(semi2);
    const final = { id: uid("po"), label: "Final", homeId: w1.winnerId, awayId: w2.winnerId, homeScore: null, awayScore: null, played: false, playedAt: null };
    const third = { id: uid("po"), label: "3º y 4º puesto", homeId: w1.loserId, awayId: w2.loserId, homeScore: null, awayScore: null, played: false, playedAt: null };
    persist({ ...data, playoffs: { ...playoffs, final, third } });
  }

  const playerName = (id) => players.find((p) => p.id === id)?.name || "???";
  const shareUrl = window.location.href;

  function copyLink() {
    navigator.clipboard.writeText(shareUrl).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }).catch(() => {});
  }

  return (
    <div style={{ background: C.cream, fontFamily: "Inter, sans-serif", color: C.ink }} className="min-h-screen w-full">
      <TopBar onMenu={() => setDrawerOpen(true)} saving={saving} view={view} mode={mode} onRefresh={refreshFromServer} />
      <Drawer open={drawerOpen} onClose={() => setDrawerOpen(false)} view={view} setView={(v) => { setView(v); setDrawerOpen(false); }} locked={{ playoffs: !regularDone && !playoffs }} />

      <main className="max-w-xl mx-auto px-4 pb-16 pt-4">
        {mode === "local" && (
          <div className="mb-4 rounded-2xl p-3 text-sm flex items-start gap-2" style={{ background: "#FBEDE9", border: `1.5px solid ${C.loss}`, color: C.loss }}>
            <span>⚠️</span>
            <span>No se ha podido conectar con el almacenamiento compartido. Los cambios se guardan solo en este dispositivo hasta que se recupere la conexión.</span>
          </div>
        )}

        <ShareBox url={shareUrl} onCopy={copyLink} copied={copied} />

        {view === "jugadores" && (
          <JugadoresView players={players} matchesExist={matches.length > 0} onAdd={addPlayer} onRename={renamePlayer} onDelete={deletePlayer} onGenerate={generateSchedule} onReset={resetLeague} />
        )}
        {view === "partidos" && <PartidosView matches={matches} playerName={playerName} onSave={saveMatchResult} players={players} />}
        {view === "clasificacion" && <ClasificacionView standings={standings} totalRegular={reg.length} />}
        {view === "playoffs" && (
          <PlayoffsView regularDone={regularDone} reg={reg} playoffs={playoffs} playerName={playerName} onGenerate={generatePlayoffs} onSave={savePlayoffResult} onGenerateFinal={generateFinalStage} />
        )}
        {view === "stats" && <StatsView players={players} matches={matches} playerName={playerName} />}
        {view === "curiosidades" && <CuriosidadesView players={players} matches={matches} playerName={playerName} />}
      </main>
    </div>
  );
}

/* ---------------- TopBar, Drawer, Share ---------------- */

function TopBar({ onMenu, saving, view, mode, onRefresh }) {
  const title = NAV.find((n) => n.key === view)?.label || "";
  return (
    <header style={{ background: C.boardDark }} className="sticky top-0 z-30 shadow-md">
      <div className="max-w-xl mx-auto px-3 py-3 flex items-center gap-3">
        <button onClick={onMenu} aria-label="Abrir menú" className="p-2 rounded-lg active:scale-95 transition" style={{ background: "rgba(255,255,255,0.08)" }}>
          <Ico k="menu" size={20} style={{ color: C.cream }} />
        </button>
        <div className="flex-1 min-w-0">
          <div style={{ fontFamily: "'Bebas Neue', sans-serif", color: C.cream, letterSpacing: "0.04em" }} className="text-2xl leading-none truncate">
            PingPong <span style={{ color: C.ball }}>Teleco Huelva</span>
          </div>
          <div style={{ color: "rgba(250,246,236,0.55)" }} className="text-[11px] mt-0.5 uppercase tracking-wider">{title}</div>
        </div>
        <button onClick={onRefresh} className="p-1.5 rounded-lg" style={{ background: "rgba(255,255,255,0.08)" }} title="Actualizar datos del grupo">
          <Ico k="refresh" size={16} style={{ color: saving ? C.ball : C.cream }} />
        </button>
      </div>
      <div style={{ background: `linear-gradient(90deg, ${C.ball}, ${C.gold})` }} className="h-[3px] w-full" />
    </header>
  );
}

function ShareBox({ url, onCopy, copied }) {
  return (
    <div className="mb-4 rounded-2xl p-3.5 flex items-center gap-3" style={{ background: C.paper, border: `1.5px solid ${C.line}` }}>
      <span style={{ fontSize: 20 }}>🔗</span>
      <div className="flex-1 min-w-0">
        <div className="text-xs font-semibold" style={{ color: C.inkSoft }}>Enlace de la liga (compártelo con el grupo)</div>
        <div className="text-[11px] truncate" style={{ color: C.inkSoft, fontFamily: "'JetBrains Mono', monospace" }}>{url}</div>
      </div>
      <button onClick={onCopy} className="px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0" style={{ background: copied ? C.win : C.ball, color: "white" }}>
        {copied ? "¡Copiado!" : "Copiar"}
      </button>
    </div>
  );
}

function Drawer({ open, onClose, view, setView, locked }) {
  return (
    <>
      <div onClick={onClose} className={`fixed inset-0 z-40 transition-opacity duration-200 ${open ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"}`} style={{ background: "rgba(9,45,37,0.55)" }} />
      <aside className={`fixed top-0 left-0 h-full w-72 max-w-[82%] z-50 transform transition-transform duration-250 ease-out flex flex-col ${open ? "translate-x-0" : "-translate-x-full"}`} style={{ background: C.boardDark }}>
        <div className="px-5 pt-6 pb-4 flex items-center justify-between" style={{ borderBottom: "1px solid rgba(255,255,255,0.1)" }}>
          <div style={{ fontFamily: "'Bebas Neue', sans-serif", color: C.cream, letterSpacing: "0.04em" }} className="text-2xl">🏓 Menú</div>
          <button onClick={onClose} className="p-1.5 rounded-lg" style={{ background: "rgba(255,255,255,0.08)" }}>
            <Ico k="close" size={16} style={{ color: C.cream }} />
          </button>
        </div>
        <nav className="flex-1 py-3 overflow-y-auto">
          {NAV.map((item) => {
            const active = item.key === view;
            return (
              <button key={item.key} onClick={() => setView(item.key)} className="w-full flex items-center gap-3 px-5 py-3.5 text-left transition" style={{ background: active ? "rgba(255,106,52,0.14)" : "transparent", borderLeft: active ? `3px solid ${C.ball}` : "3px solid transparent" }}>
                <Ico k={item.icon} size={18} style={{ color: active ? C.ball : "rgba(250,246,236,0.75)" }} />
                <span style={{ color: active ? C.cream : "rgba(250,246,236,0.75)", fontWeight: active ? 600 : 500 }} className="text-[15px]">{item.label}</span>
                {item.key === "playoffs" && locked.playoffs && <span className="ml-auto text-[10px] uppercase tracking-wide" style={{ color: "rgba(250,246,236,0.4)" }}>bloqueado</span>}
              </button>
            );
          })}
        </nav>
        <div className="px-5 py-4 text-[11px]" style={{ color: "rgba(250,246,236,0.35)", borderTop: "1px solid rgba(255,255,255,0.1)" }}>Liga a 11 puntos · ida y vuelta · playoff top 4</div>
      </aside>
    </>
  );
}

/* ---------------- Jugadores ---------------- */

function JugadoresView({ players, matchesExist, onAdd, onRename, onDelete, onGenerate, onReset }) {
  const [name, setName] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);

  return (
    <div className="space-y-5 pt-1">
      <SectionCard>
        <SectionTitle>Añadir jugador</SectionTitle>
        <div className="flex gap-2 mt-3">
          <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { onAdd(name); setName(""); } }} placeholder="Nombre del jugador" disabled={matchesExist} className="flex-1 px-3 py-2.5 rounded-xl text-sm outline-none" style={{ border: `1.5px solid ${C.line}`, background: matchesExist ? "#F2EEE1" : C.paper }} />
          <button onClick={() => { onAdd(name); setName(""); }} disabled={matchesExist || !name.trim()} className="px-4 rounded-xl flex items-center justify-center disabled:opacity-40" style={{ background: C.ball }}>
            <Ico k="plus" size={18} style={{ color: "white" }} />
          </button>
        </div>
        {matchesExist && <p className="text-xs mt-2" style={{ color: C.inkSoft }}>El calendario ya está generado. Reinicia la liga para cambiar jugadores.</p>}
      </SectionCard>

      <SectionCard>
        <SectionTitle>Jugadores ({players.length})</SectionTitle>
        {players.length === 0 && <EmptyState text="Todavía no hay jugadores." />}
        <div className="mt-2 divide-y" style={{ borderColor: C.line }}>
          {players.map((p, i) => (
            <div key={p.id} className="flex items-center gap-3 py-2.5" style={{ borderColor: C.line }}>
              <Avatar name={p.name} index={i} />
              {editingId === p.id ? (
                <input value={editName} autoFocus onChange={(e) => setEditName(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { onRename(p.id, editName); setEditingId(null); } if (e.key === "Escape") setEditingId(null); }} className="flex-1 px-2 py-1 rounded-lg text-sm outline-none" style={{ border: `1.5px solid ${C.ball}` }} />
              ) : (
                <span className="flex-1 text-sm font-medium">{p.name}</span>
              )}
              {editingId === p.id ? (
                <button onClick={() => { onRename(p.id, editName); setEditingId(null); }} className="p-1.5"><Ico k="check" size={15} style={{ color: C.win }} /></button>
              ) : (
                <button onClick={() => { setEditingId(p.id); setEditName(p.name); }} className="p-1.5"><Ico k="edit" size={14} style={{ color: C.inkSoft }} /></button>
              )}
              {!matchesExist && <button onClick={() => onDelete(p.id)} className="p-1.5"><Ico k="trash" size={14} style={{ color: C.loss }} /></button>}
            </div>
          ))}
        </div>
      </SectionCard>

      {!matchesExist && (
        <button onClick={onGenerate} disabled={players.length < 3} className="w-full py-3.5 rounded-2xl font-semibold text-white flex items-center justify-center gap-2 disabled:opacity-40" style={{ background: `linear-gradient(135deg, ${C.ball}, ${C.ballDark})` }}>
          <Ico k="swords" size={18} /> Generar calendario (ida y vuelta)
        </button>
      )}
      {players.length > 0 && players.length < 3 && !matchesExist && <p className="text-xs text-center" style={{ color: C.inkSoft }}>Se necesitan al menos 3 jugadores.</p>}

      {matchesExist && (
        <div className="pt-2">
          {!confirmReset ? (
            <button onClick={() => setConfirmReset(true)} className="w-full py-3 rounded-2xl text-sm font-medium" style={{ color: C.loss, border: `1.5px solid ${C.loss}` }}>Reiniciar liga</button>
          ) : (
            <div className="p-3 rounded-2xl space-y-2" style={{ border: `1.5px solid ${C.loss}`, background: "#FBEDE9" }}>
              <p className="text-sm font-medium" style={{ color: C.loss }}>Esto borrará jugadores, partidos y playoffs. ¿Seguro?</p>
              <div className="flex gap-2">
                <button onClick={() => { onReset(); setConfirmReset(false); }} className="flex-1 py-2 rounded-xl text-sm font-semibold text-white" style={{ background: C.loss }}>Sí, borrar todo</button>
                <button onClick={() => setConfirmReset(false)} className="flex-1 py-2 rounded-xl text-sm font-semibold" style={{ border: `1.5px solid ${C.line}` }}>Cancelar</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------- Partidos ---------------- */

function PartidosView({ matches, playerName, onSave, players }) {
  const [onlyPending, setOnlyPending] = useState(true);
  if (players.length === 0) return <EmptyState text="Añade jugadores desde la pestaña Jugadores." />;
  if (matches.length === 0) return <EmptyState text="Todavía no hay calendario. Genéralo desde la pestaña Jugadores." />;

  const played = matches.filter((m) => m.played).length;
  const groups = [1, 2].map((leg) => {
    const legMatches = matches.filter((m) => m.leg === leg);
    const rounds = [...new Set(legMatches.map((m) => m.round))].sort((a, b) => a - b);
    return { leg, rounds, legMatches };
  });

  return (
    <div className="space-y-4 pt-1">
      <ProgressBar played={played} total={matches.length} label="Fase regular" />
      <div className="flex items-center justify-between px-1">
        <span className="text-sm font-medium" style={{ color: C.inkSoft }}>{onlyPending ? "Mostrando pendientes" : "Mostrando todos"}</span>
        <Toggle checked={onlyPending} onChange={setOnlyPending} />
      </div>
      {groups.map((g) => (
        <div key={g.leg}>
          <div className="text-xs font-bold uppercase tracking-widest mb-2 mt-4 px-1" style={{ color: C.gold }}>{g.leg === 1 ? "🏓 Ida" : "🔁 Vuelta"}</div>
          {g.rounds.map((r) => {
            const roundMatches = g.legMatches.filter((m) => m.round === r).filter((m) => (onlyPending ? !m.played : true));
            if (roundMatches.length === 0) return null;
            return (
              <div key={r} className="mb-4">
                <div className="text-[11px] font-semibold mb-1.5 px-1" style={{ color: C.inkSoft }}>Jornada {r}</div>
                <div className="space-y-2.5">
                  {roundMatches.map((m) => <MatchCard key={m.id} match={m} playerName={playerName} onSave={(h, a) => onSave(m.id, h, a)} />)}
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function MatchCard({ match, playerName, onSave, seeds }) {
  const [editing, setEditing] = useState(false);
  const [h, setH] = useState(match.homeScore ?? "");
  const [a, setA] = useState(match.awayScore ?? "");
  const valid = isValidScore(h, a);
  const showForm = editing || !match.played;
  const homeWon = match.played && match.homeScore > match.awayScore;
  const awayWon = match.played && match.awayScore > match.homeScore;

  return (
    <div className="rounded-2xl overflow-hidden" style={{ background: C.boardDark, boxShadow: "0 2px 8px rgba(14,58,48,0.18)" }}>
      <div className="flex items-center px-4 py-3.5">
        <div className="flex-1 min-w-0">
          <div className="text-[10px] uppercase tracking-wider mb-1" style={{ color: seeds ? C.gold : "rgba(250,246,236,0.4)" }}>{seeds ? `#${seeds[0]}` : "Local"}</div>
          <div className="text-[15px] truncate" style={{ color: homeWon ? C.gold : C.cream, fontWeight: homeWon ? 700 : 500 }}>{playerName(match.homeId)}</div>
        </div>
        {!showForm ? (
          <div className="flex items-center gap-2 px-2">
            <ScoreDigit value={match.homeScore} highlight={homeWon} />
            <span style={{ color: "rgba(250,246,236,0.3)" }}>–</span>
            <ScoreDigit value={match.awayScore} highlight={awayWon} />
          </div>
        ) : (
          <div className="flex items-center gap-1.5 px-1">
            <ScoreInput value={h} onChange={setH} />
            <span style={{ color: "rgba(250,246,236,0.3)" }}>–</span>
            <ScoreInput value={a} onChange={setA} />
          </div>
        )}
        <div className="flex-1 min-w-0 text-right">
          <div className="text-[10px] uppercase tracking-wider mb-1" style={{ color: seeds ? C.gold : "rgba(250,246,236,0.4)" }}>{seeds ? `#${seeds[1]}` : "Visitante"}</div>
          <div className="text-[15px] truncate" style={{ color: awayWon ? C.gold : C.cream, fontWeight: awayWon ? 700 : 500 }}>{playerName(match.awayId)}</div>
        </div>
      </div>
      <div style={{ borderTop: "1px dashed rgba(250,246,236,0.15)" }} className="px-4 py-2 flex items-center justify-between">
        {match.played && !editing ? (
          <>
            <span className="text-[11px]" style={{ color: "rgba(250,246,236,0.45)" }}>Resultado guardado</span>
            <button onClick={() => { setEditing(true); setH(match.homeScore); setA(match.awayScore); }} className="text-[11px] font-semibold flex items-center gap-1" style={{ color: C.ball }}>
              <Ico k="edit" size={11} /> Editar
            </button>
          </>
        ) : (
          <>
            <span className="text-[11px]" style={{ color: valid ? "rgba(250,246,236,0.45)" : C.ball }}>{valid ? "A 11 puntos, con 2 de diferencia" : "Mínimo 11 y 2 de diferencia"}</span>
            <div className="flex gap-2">
              {editing && <button onClick={() => setEditing(false)} className="text-[11px] font-semibold" style={{ color: "rgba(250,246,236,0.5)" }}>Cancelar</button>}
              <button onClick={() => { if (valid) { onSave(h, a); setEditing(false); } }} disabled={!valid} className="text-[11px] font-semibold px-2.5 py-1 rounded-lg disabled:opacity-30" style={{ background: C.ball, color: "white" }}>Guardar</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ScoreDigit({ value, highlight }) {
  return (
    <div className="w-9 h-10 rounded-lg flex items-center justify-center text-xl" style={{ fontFamily: "'JetBrains Mono', monospace", background: highlight ? "rgba(227,178,60,0.18)" : "rgba(250,246,236,0.06)", color: highlight ? C.gold : C.cream, fontWeight: 700 }}>{value}</div>
  );
}
function ScoreInput({ value, onChange }) {
  return (
    <input type="number" inputMode="numeric" min="0" value={value} onChange={(e) => onChange(e.target.value)} className="w-11 h-10 rounded-lg text-center text-lg outline-none" style={{ fontFamily: "'JetBrains Mono', monospace", background: "rgba(250,246,236,0.1)", color: C.cream, border: "1.5px solid rgba(255,106,52,0.5)" }} />
  );
}

/* ---------------- Clasificación ---------------- */

function ClasificacionView({ standings, totalRegular }) {
  if (standings.length === 0) return <EmptyState text="La clasificación aparecerá en cuanto haya jugadores." />;
  return (
    <div className="pt-1 space-y-3">
      <SectionCard padded={false}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            <thead>
              <tr style={{ background: C.boardDark, color: C.cream }}>
                <th className="py-2.5 pl-3 pr-1 text-left text-[11px] font-semibold">#</th>
                <th className="py-2.5 pr-2 text-left text-[11px] font-semibold" style={{ fontFamily: "Inter, sans-serif" }}>Jugador</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">PJ</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">PG</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">PP</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">PF</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">PC</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">DIF</th>
                <th className="py-2.5 px-1 text-[11px] font-semibold">RATIO</th>
                <th className="py-2.5 pr-3 pl-1 text-[11px] font-semibold" style={{ color: C.gold }}>PTS</th>
              </tr>
            </thead>
            <tbody>
              {standings.map((s, i) => (
                <tr key={s.id} style={{ background: i % 2 ? C.paper : "#FBF8F0", borderBottom: `1px solid ${C.line}` }}>
                  <td className="py-2.5 pl-3 pr-1 font-bold" style={{ color: i < 4 ? C.ball : C.inkSoft }}>{i + 1}</td>
                  <td className="py-2.5 pr-2 font-semibold" style={{ fontFamily: "Inter, sans-serif" }}>{s.name}</td>
                  <td className="py-2.5 px-1 text-center">{s.pj}</td>
                  <td className="py-2.5 px-1 text-center" style={{ color: C.win }}>{s.pg}</td>
                  <td className="py-2.5 px-1 text-center" style={{ color: C.loss }}>{s.pp}</td>
                  <td className="py-2.5 px-1 text-center">{s.pf}</td>
                  <td className="py-2.5 px-1 text-center">{s.pc}</td>
                  <td className="py-2.5 px-1 text-center">{s.pf - s.pc > 0 ? `+${s.pf - s.pc}` : s.pf - s.pc}</td>
                  <td className="py-2.5 px-1 text-center">{s.pc > 0 ? (s.pf / s.pc).toFixed(2) : s.pf > 0 ? "∞" : "–"}</td>
                  <td className="py-2.5 pr-3 pl-1 text-center font-bold" style={{ color: C.gold }}>{s.pts}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </SectionCard>
      <p className="text-[11px] px-1" style={{ color: C.inkSoft }}>2 pts por victoria · Empate a puntos: decide el enfrentamiento particular (ida y vuelta) y, si también hay empate, el ratio a favor/en contra · Los 4 primeros clasifican para el playoff {totalRegular > 0 ? `(${totalRegular} partidos en fase regular)` : ""}</p>
    </div>
  );
}

/* ---------------- Playoffs ---------------- */

function PlayoffsView({ regularDone, reg, playoffs, playerName, onGenerate, onSave, onGenerateFinal }) {
  const played = reg.filter((m) => m.played).length;
  if (!playoffs) {
    return (
      <div className="pt-1 space-y-4">
        <ProgressBar played={played} total={reg.length} label="Progreso liga regular" />
        {regularDone ? (
          <>
            <EmptyState text="¡Fase regular completa! Genera el cuadro de playoffs con los 4 mejores." />
            <button onClick={onGenerate} className="w-full py-3.5 rounded-2xl font-semibold text-white flex items-center justify-center gap-2" style={{ background: `linear-gradient(135deg, ${C.gold}, ${C.ball})` }}>
              <Ico k="trophy" size={18} /> Generar Playoffs
            </button>
          </>
        ) : <EmptyState text="El playoff se desbloquea cuando terminen todos los partidos de ida y vuelta." />}
      </div>
    );
  }
  const { semi1, semi2, final, third, seeds } = playoffs;
  const bothSemisPlayed = semi1.played && semi2.played;
  const champion = final?.played ? (final.homeScore > final.awayScore ? final.homeId : final.awayId) : null;

  return (
    <div className="pt-1 space-y-5">
      {champion && (
        <div className="rounded-2xl p-5 text-center" style={{ background: `linear-gradient(135deg, ${C.gold}, #F4D27A)` }}>
          <div style={{ fontSize: 30 }}>🏅</div>
          <div className="text-[11px] uppercase tracking-widest font-bold mt-1" style={{ color: C.boardDarker }}>Campeón de la liga</div>
          <div style={{ fontFamily: "'Bebas Neue', sans-serif", color: C.boardDarker, letterSpacing: "0.03em" }} className="text-3xl mt-0.5">{playerName(champion)}</div>
        </div>
      )}
      <PlayoffStage title="Semifinales">
        <MatchCard match={semi1} playerName={playerName} onSave={(h, a) => onSave("semi1", h, a)} seeds={[semi1.seedHome, semi1.seedAway]} />
        <MatchCard match={semi2} playerName={playerName} onSave={(h, a) => onSave("semi2", h, a)} seeds={[semi2.seedHome, semi2.seedAway]} />
      </PlayoffStage>
      {bothSemisPlayed && !final && (
        <button onClick={onGenerateFinal} className="w-full py-3.5 rounded-2xl font-semibold text-white flex items-center justify-center gap-2" style={{ background: `linear-gradient(135deg, ${C.gold}, ${C.ball})` }}>
          <Ico k="chevron" size={18} /> Generar Final y 3º puesto
        </button>
      )}
      {final && <PlayoffStage title="Final"><MatchCard match={final} playerName={playerName} onSave={(h, a) => onSave("final", h, a)} /></PlayoffStage>}
      {third && <PlayoffStage title="3º y 4º puesto"><MatchCard match={third} playerName={playerName} onSave={(h, a) => onSave("third", h, a)} /></PlayoffStage>}
      <SectionCard>
        <SectionTitle>Cabezas de serie</SectionTitle>
        <div className="mt-2 space-y-1.5">
          {seeds.map((s, i) => (
            <div key={s.id} className="flex items-center gap-2 text-sm"><span className="w-5 font-bold" style={{ color: C.ball }}>{i + 1}</span><span>{s.name}</span></div>
          ))}
        </div>
      </SectionCard>
    </div>
  );
}
function PlayoffStage({ title, children }) {
  return (
    <div>
      <div className="text-xs font-bold uppercase tracking-widest mb-2 px-1" style={{ color: C.gold }}>{title}</div>
      <div className="space-y-2.5">{children}</div>
    </div>
  );
}

/* ---------------- Estadísticas ---------------- */

function StatsView({ players, matches, playerName }) {
  const played = matches.filter((m) => m.played);
  if (players.length === 0) return <EmptyState text="Las estadísticas aparecerán cuando haya jugadores y partidos." />;
  if (played.length === 0) return <EmptyState text="Todavía no se ha jugado ningún partido." />;

  const totalPoints = played.reduce((s, m) => s + m.homeScore + m.awayScore, 0);
  const avg = (totalPoints / played.length).toFixed(1);
  const perPlayer = {};
  players.forEach((p) => { perPlayer[p.id] = { name: p.name, pf: 0, pg: 0, pj: 0, matches: [] }; });
  played.forEach((m) => {
    if (perPlayer[m.homeId]) { perPlayer[m.homeId].pf += m.homeScore; perPlayer[m.homeId].pj++; if (m.homeScore > m.awayScore) perPlayer[m.homeId].pg++; perPlayer[m.homeId].matches.push({ ...m, won: m.homeScore > m.awayScore, order: m.playedAt || 0 }); }
    if (perPlayer[m.awayId]) { perPlayer[m.awayId].pf += m.awayScore; perPlayer[m.awayId].pj++; if (m.awayScore > m.homeScore) perPlayer[m.awayId].pg++; perPlayer[m.awayId].matches.push({ ...m, won: m.awayScore > m.homeScore, order: m.playedAt || 0 }); }
  });
  const topScorer = Object.values(perPlayer).sort((a, b) => b.pf - a.pf)[0];
  const topWinner = Object.values(perPlayer).sort((a, b) => b.pg - a.pg)[0];
  let bestStreak = { name: "-", n: 0 };
  Object.values(perPlayer).forEach((p) => {
    const sorted = [...p.matches].sort((a, b) => a.order - b.order);
    let cur = 0, best = 0;
    sorted.forEach((m) => { cur = m.won ? cur + 1 : 0; best = Math.max(best, cur); });
    if (best > bestStreak.n) bestStreak = { name: p.name, n: best };
  });
  const biggest = [...played].sort((a, b) => Math.abs(b.homeScore - b.awayScore) - Math.abs(a.homeScore - a.awayScore))[0];

  return (
    <div className="pt-1 space-y-3">
      <div className="grid grid-cols-2 gap-3">
        <StatCard icon="target" label="Partidos jugados" value={played.length} />
        <StatCard icon="trending" label="Puntos totales" value={totalPoints} />
        <StatCard icon="chart" label="Media pts/partido" value={avg} />
        <StatCard icon="flame" label="Mejor racha" value={`${bestStreak.n}`} sub={bestStreak.name} />
      </div>
      <SectionCard><SectionTitle>Máximo anotador</SectionTitle><StatRow name={topScorer.name} value={`${topScorer.pf} pts a favor`} /></SectionCard>
      <SectionCard><SectionTitle>Más victorias</SectionTitle><StatRow name={topWinner.name} value={`${topWinner.pg} victorias`} /></SectionCard>
      {biggest && <SectionCard><SectionTitle>Mayor paliza</SectionTitle><StatRow name={`${playerName(biggest.homeId)} ${biggest.homeScore} – ${biggest.awayScore} ${playerName(biggest.awayId)}`} value={`dif. ${Math.abs(biggest.homeScore - biggest.awayScore)}`} /></SectionCard>}
    </div>
  );
}
function StatCard({ icon, label, value, sub }) {
  return (
    <div className="rounded-2xl p-4" style={{ background: C.boardDark }}>
      <Ico k={icon} size={17} style={{ color: C.ball }} />
      <div style={{ fontFamily: "'Bebas Neue', sans-serif", color: C.cream, letterSpacing: "0.02em" }} className="text-3xl mt-2 leading-none">{value}</div>
      <div className="text-[11px] mt-1" style={{ color: "rgba(250,246,236,0.55)" }}>{label}</div>
      {sub && <div className="text-[11px] font-semibold mt-0.5" style={{ color: C.gold }}>{sub}</div>}
    </div>
  );
}
function StatRow({ name, value }) {
  return <div className="flex items-center justify-between mt-2"><span className="text-sm font-medium">{name}</span><span className="text-sm font-bold" style={{ color: C.ball }}>{value}</span></div>;
}

/* ---------------- Curiosidades ---------------- */

function CuriosidadesView({ players, matches, playerName }) {
  const played = matches.filter((m) => m.played);
  if (played.length === 0) return <EmptyState text="Los datos curiosos irán apareciendo según se jueguen partidos." />;
  const totalPoints = played.reduce((s, m) => s + m.homeScore + m.awayScore, 0);
  const closest = [...played].sort((a, b) => Math.abs(a.homeScore - a.awayScore) - Math.abs(b.homeScore - b.awayScore))[0];
  const biggest = [...played].sort((a, b) => Math.abs(b.homeScore - b.awayScore) - Math.abs(a.homeScore - a.awayScore))[0];
  const longest = [...played].sort((a, b) => (b.homeScore + b.awayScore) - (a.homeScore + a.awayScore))[0];
  const perPlayer = {};
  players.forEach((p) => { perPlayer[p.id] = 0; });
  played.forEach((m) => { if (m.homeId in perPlayer) perPlayer[m.homeId] += m.homeScore; if (m.awayId in perPlayer) perPlayer[m.awayId] += m.awayScore; });
  const busiest = Object.entries(perPlayer).sort((a, b) => b[1] - a[1])[0];
  const facts = [
    `Entre todos ya lleváis ${totalPoints} puntos anotados en ${played.length} partidos — como jugar unos ${Math.round(totalPoints / 11)} juegos completos a 11 seguidos.`,
    closest && `El punto más ajustado fue ${playerName(closest.homeId)} ${closest.homeScore}–${closest.awayScore} ${playerName(closest.awayId)}, decidido al filo del deuce.`,
    biggest && `La mayor paliza de la liga: ${playerName(biggest.homeId)} ${biggest.homeScore}–${biggest.awayScore} ${playerName(biggest.awayId)}, con ${Math.abs(biggest.homeScore - biggest.awayScore)} puntos de diferencia.`,
    longest && `El partido con más puntos en juego fue ${playerName(longest.homeId)} ${longest.homeScore}–${longest.awayScore} ${playerName(longest.awayId)} (${longest.homeScore + longest.awayScore} puntos totales).`,
    busiest && `${players.find((p) => p.id === busiest[0])?.name} es quien más puntos ha anotado en total: ${busiest[1]}.`,
  ].filter(Boolean);
  return (
    <div className="pt-1 space-y-3">
      {facts.map((f, i) => (
        <div key={i} className="rounded-2xl p-4 flex gap-3" style={{ background: C.paper, border: `1.5px solid ${C.line}` }}>
          <span style={{ fontSize: 18 }}>✨</span>
          <p className="text-sm leading-relaxed">{f}</p>
        </div>
      ))}
    </div>
  );
}

/* ---------------- UI primitives ---------------- */

function SectionCard({ children, padded = true }) {
  return <div className="rounded-2xl" style={{ background: C.paper, border: `1.5px solid ${C.line}`, padding: padded ? "16px" : 0 }}>{children}</div>;
}
function SectionTitle({ children }) {
  return <div className="text-[11px] font-bold uppercase tracking-widest px-4 pt-4 first:pt-0 first:px-0" style={{ color: C.inkSoft }}>{children}</div>;
}
function EmptyState({ text }) {
  return (
    <div className="rounded-2xl py-10 px-6 text-center" style={{ background: C.paper, border: `1.5px dashed ${C.line}` }}>
      <span style={{ fontSize: 26 }}>🏓</span>
      <p className="text-sm mt-2" style={{ color: C.inkSoft }}>{text}</p>
    </div>
  );
}
function Avatar({ name, index }) {
  const colors = [C.ball, C.gold, C.win, "#4A7A9E", "#9E5A9C", "#C24A32", "#7A8A3E"];
  const color = colors[index % colors.length];
  const initials = name.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  return <div className="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold text-white shrink-0" style={{ background: color }}>{initials}</div>;
}
function ProgressBar({ played, total, label }) {
  const pct = total > 0 ? Math.round((played / total) * 100) : 0;
  return (
    <div className="px-1">
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-xs font-semibold" style={{ color: C.inkSoft }}>{label}</span>
        <span className="text-xs font-bold" style={{ color: C.ball }}>{played}/{total}</span>
      </div>
      <div className="h-2 rounded-full overflow-hidden" style={{ background: C.line }}>
        <div className="h-full rounded-full transition-all" style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${C.ball}, ${C.gold})` }} />
      </div>
    </div>
  );
}
function Toggle({ checked, onChange }) {
  return (
    <button onClick={() => onChange(!checked)} className="w-11 h-6 rounded-full relative transition-colors" style={{ background: checked ? C.ball : C.line }}>
      <div className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all shadow" style={{ left: checked ? "22px" : "2px" }} />
    </button>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
